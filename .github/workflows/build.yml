name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: cmake --install build --config Release --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: s1x-debug-overlay
          path: dist/

      # Publishes version.dll as a plain file on the Releases page:
      # https://github.com/murphyongit/s1x-debug_overlay/releases/latest/download/version.dll
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --yes --cleanup-tag }
          $notes = "Build of commit ${{ github.sha }}. Download version.dll and put it in your game folder."
          gh release create latest dist/try_this_first/version.dll --title "Latest build" --notes $notes --target ${{ github.sha }}

      # The separate runner-only recorder:
      # https://github.com/murphyongit/s1x-debug_overlay/releases/download/recorder/version.dll
      - name: Publish recorder release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view recorder *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete recorder --yes --cleanup-tag }
          $notes = "Speed run recorder (no overlay). Download version.dll and put it in your game folder."
          gh release create recorder dist/speedrun_recorder/version.dll dist/speedrun_recorder/FOR_RUNNERS.txt --title "Speed run recorder" --notes $notes --target ${{ github.sha }}
